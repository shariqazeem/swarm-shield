[package]
name = "swarm-shield"
version = "0.1.0"
description = "Dark Liquidity Pool for Autonomous AI Agents - MEV Protection on Solana"
edition = "2021"
license = "MIT"
repository = "https://github.com/swarmshield/swarm-shield"

[lib]
crate-type = ["cdylib", "lib"]
name = "swarm_shield"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
# Light Protocol ZK Compression for private trade intents
# Temporarily commented for production build - will add back with full integration
# light-sdk = { git = "https://github.com/Lightprotocol/light-protocol.git", features = ["cpi"] }
# account-compression = { git = "https://github.com/solana-labs/solana-program-library", features = ["cpi"] }

[dev-dependencies]
anchor-client = "0.31.1"
